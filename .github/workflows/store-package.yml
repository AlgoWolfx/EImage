name: Prepare Microsoft Store submission
on:
  workflow_dispatch:
    inputs:
      identity_name:
        description: Exact Package/Identity/Name from Partner Center
        required: true
        type: string
      identity_publisher:
        description: Exact Package/Identity/Publisher from Partner Center (CN=...)
        required: true
        type: string
      publisher_display_name:
        description: Exact publisher display name from Partner Center
        required: true
        type: string
      display_name:
        description: Reserved Store application name
        required: true
        default: EIMAGE
        type: string
      package_version:
        description: Four-part Store version; major >= 1, final component 0
        required: true
        default: 1.0.0.0
        type: string
permissions:
  contents: read
jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    env:
      EIMAGE_STORE_IDENTITY_NAME: ${{ inputs.identity_name }}
      EIMAGE_STORE_IDENTITY_PUBLISHER: ${{ inputs.identity_publisher }}
      EIMAGE_STORE_PUBLISHER_DISPLAY_NAME: ${{ inputs.publisher_display_name }}
      EIMAGE_STORE_DISPLAY_NAME: ${{ inputs.display_name }}
      EIMAGE_STORE_VERSION: ${{ inputs.package_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check actual Store identity before building
        run: node --experimental-strip-types scripts/prepare-store.mjs --check-identity
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - run: npm test
      - run: npm run build:desktop -- --ci --no-bundle --no-sign
      - name: Prepare and verify unsigned package for Microsoft signing
        shell: pwsh
        run: ./scripts/package-store.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: eimage-Microsoft-Store-submission-x64
          path: |
            artifacts/store/*.msix
            artifacts/store/SHA256SUMS.txt
            artifacts/store/package-metadata.json
          if-no-files-found: error
# This workflow prepares an upload, never a public release. Microsoft certifies and
# signs the MSIX in Partner Center. No self-signed certificate or PC trust change.
