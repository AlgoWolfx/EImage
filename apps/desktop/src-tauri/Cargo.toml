[package]
name = "eimage"
version = "0.1.0"
description = "Free, local screenshot capture and annotation"
authors = ["Yiğit Bayrak"]
license = "MIT"
edition = "2021"
[lib]
name = "eimage_lib"
crate-type = ["rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }
tempfile = "3"
arboard = "3"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 1
strip = "debuginfo"
codegen-units = 16
